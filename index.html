<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>天增團購系統 - LINE</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>

<body>

  <h1>LINE 團購系統</h1>

  <p id="status">LINE 登入中...</p>

  <script>

    const LIFF_ID = '2011633639-yuSTNpAR';

    const API_URL =
      'https://script.google.com/macros/s/AKfycbxpNY5FuKMsL8GClN9oH_uznXM_o7HLkPPQcZSvVBbGCLvIdXOVB9ptgf1VGsrj66GE8A/exec';

    async function init() {
      try {
        await liff.init({ liffId: LIFF_ID });
    
        console.log('LIFF 初始化成功');
        console.log('LIFF logged in:', liff.isLoggedIn());
    
        if (!liff.isLoggedIn()) {
          console.log('尚未登入 LINE，開始登入');
          liff.login();
          return;
        }
    
        const idToken = liff.getIDToken();
    
        console.log('ID Token exists:', !!idToken);
        console.log('ID Token:', idToken);
    
        if (!idToken) {
          throw new Error('無法取得 LINE ID Token，請確認 LIFF Scope 是否包含 openid');
        }
    
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action: 'verifyAdmin',
            idToken: idToken
          })
        });
        
        const result = await response.json();
        
        console.log('Admin API 回應：', result);
        
        if (!result.success) {
          throw new Error(
            result.message ||
            result.error ||
            'Admin 驗證失敗'
          );
        }
        
        if (!result.admin.isAdmin) {
        
          document.getElementById('status').textContent =
            'LINE 登入成功，但你不是管理員';
        
          return;
        }
        
        document.getElementById('status').textContent =
          '管理員登入成功：' +
          result.user.displayName +
          ' (' +
          result.admin.role +
          ')';
        
        console.log('管理員：', result.admin);
    
      } catch (error) {
        console.error('錯誤：', error);
    
        document.getElementById('status').textContent =
          'LINE 登入失敗：' + error.message;
      }
    }
    
    init();

  </script>

</body>

</html>
