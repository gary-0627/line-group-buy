<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>LINE 團購系統</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #f5f6f8;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 40px;
    }

    /* =========================
       Loading
    ========================= */

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background: rgba(255, 255, 255, 0.96);
    }

    .loading-box {
      width: 100%;
      max-width: 320px;
      padding: 28px 20px;

      text-align: center;

      background: #fff;
      border-radius: 16px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .loading-spinner {
      width: 36px;
      height: 36px;

      margin: 0 auto 16px;

      border: 4px solid #e5e7eb;
      border-top-color: #06c755;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      color: #555;
      font-size: 15px;
      line-height: 1.5;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       Error
    ========================= */

    #errorScreen {
      display: none;
    }

    .error-box {
      padding: 24px;

      background: #fff;
      border-radius: 16px;

      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .error-title {
      margin: 0 0 12px;

      color: #dc2626;
      font-size: 20px;
      font-weight: 700;
    }

    .error-message {
      margin-bottom: 20px;

      color: #555;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    /* =========================
       Header
    ========================= */

    .header {
      margin-bottom: 16px;
    }

    .header-title {
      margin: 0;

      font-size: 24px;
      font-weight: 700;
    }

    .header-subtitle {
      margin-top: 6px;

      color: #777;
      font-size: 14px;
    }

    /* =========================
       User Card
    ========================= */

    .user-card {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 16px;
      padding: 14px 16px;

      background: #fff;
      border-radius: 14px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.05);
    }

    .user-avatar {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      background: #06c755;
      color: #fff;

      border-radius: 50%;

      font-weight: 700;
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .user-name {
      font-weight: 700;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .user-role {
      margin-top: 3px;

      color: #777;
      font-size: 13px;
    }

    /* =========================
       Card
    ========================= */

    .card {
      margin-bottom: 16px;
      padding: 20px;

      background: #fff;
      border-radius: 16px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.05);
    }

    .card-title {
      margin: 0 0 16px;

      font-size: 18px;
      font-weight: 700;
    }

    /* =========================
       Product
    ========================= */

    .product-status {
      display: inline-flex;
      align-items: center;

      margin-bottom: 12px;
      padding: 5px 10px;

      border-radius: 999px;

      font-size: 13px;
      font-weight: 600;
    }

    .status-open {
      background: #dcfce7;
      color: #15803d;
    }

    .status-draft {
      background: #fef3c7;
      color: #a16207;
    }

    .status-closed {
      background: #fee2e2;
      color: #b91c1c;
    }

    .product-name {
      margin: 0 0 10px;

      font-size: 26px;
      font-weight: 700;
      line-height: 1.35;
    }

    .product-price {
      margin-bottom: 14px;

      color: #e11d48;

      font-size: 24px;
      font-weight: 700;
    }

    .product-description {
      margin-bottom: 18px;

      color: #555;

      line-height: 1.7;
      white-space: pre-wrap;
    }

    .product-info-row {
      display: flex;
      justify-content: space-between;

      padding: 10px 0;

      border-bottom: 1px solid #eee;

      font-size: 14px;
    }

    .product-info-row:last-child {
      border-bottom: 0;
    }

    .product-info-label {
      color: #777;
    }

    .product-info-value {
      font-weight: 600;
      text-align: right;
    }

    /* =========================
       Quantity
    ========================= */

    .quantity-section {
      margin-top: 20px;
    }

    .field-label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 600;
    }

    .quantity-control {
      display: flex;
      align-items: center;

      width: 100%;
      max-width: 220px;

      margin-bottom: 20px;
    }

    .quantity-button {
      width: 48px;
      height: 48px;

      border: 1px solid #ddd;
      background: #f8f8f8;

      font-size: 24px;

      border-radius: 10px;
    }

    .quantity-value {
      flex: 1;

      text-align: center;

      font-size: 20px;
      font-weight: 700;
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 18px;
      padding: 16px;

      background: #f8fafc;

      border-radius: 12px;
    }

    .total-label {
      color: #555;
    }

    .total-price {
      color: #e11d48;

      font-size: 24px;
      font-weight: 700;
    }

    /* =========================
       Form
    ========================= */

    .form-group {
      margin-bottom: 16px;
    }

    .form-input,
    .form-textarea,
    .form-select {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid #d1d5db;
      border-radius: 10px;

      background: #fff;

      outline: none;

      transition:
        border-color 0.15s,
        box-shadow 0.15s;
    }

    .form-input:focus,
    .form-textarea:focus,
    .form-select:focus {
      border-color: #06c755;

      box-shadow:
        0 0 0 3px rgba(6, 199, 85, 0.12);
    }

    .form-textarea {
      min-height: 110px;
      resize: vertical;
    }

    .form-help {
      margin-top: 6px;

      color: #888;
      font-size: 12px;
      line-height: 1.5;
    }

    /* =========================
       Buttons
    ========================= */

    .button {
      width: 100%;

      min-height: 48px;

      padding: 12px 16px;

      border: 0;
      border-radius: 10px;

      font-weight: 700;

      transition:
        opacity 0.15s,
        transform 0.05s;
    }

    .button:active {
      transform: scale(0.98);
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .button-primary {
      background: #06c755;
      color: #fff;
    }

    .button-secondary {
      background: #f1f5f9;
      color: #333;
    }

    .button-danger {
      background: #dc2626;
      color: #fff;
    }

    .button + .button {
      margin-top: 10px;
    }

    /* =========================
       Admin Menu
    ========================= */

    .admin-menu {
      display: grid;

      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: 12px;
    }

    .admin-menu-button {
      min-height: 100px;

      padding: 18px;

      border: 0;

      background: #f8fafc;

      border-radius: 14px;

      text-align: left;
    }

    .admin-menu-icon {
      margin-bottom: 8px;

      font-size: 26px;
    }

    .admin-menu-title {
      font-weight: 700;
    }

    .admin-menu-description {
      margin-top: 4px;

      color: #777;
      font-size: 12px;
      line-height: 1.4;
    }

    /* =========================
       Result
    ========================= */

    .success-box {
      padding: 18px;

      background: #f0fdf4;

      border: 1px solid #bbf7d0;

      border-radius: 12px;
    }

    .success-title {
      margin-bottom: 8px;

      color: #15803d;

      font-size: 18px;
      font-weight: 700;
    }

    .link-box {
      margin: 12px 0;

      padding: 12px;

      background: #fff;

      border: 1px solid #ddd;
      border-radius: 8px;

      font-size: 13px;

      word-break: break-all;
    }

    /* =========================
       Navigation
    ========================= */

    .back-button {
      display: inline-flex;
      align-items: center;

      margin-bottom: 14px;

      padding: 8px 0;

      border: 0;
      background: transparent;

      color: #555;

      font-size: 14px;
    }

    /* =========================
       Mobile
    ========================= */

    @media (max-width: 480px) {
      .container {
        padding: 12px;
      }

      .card {
        padding: 16px;
      }

      .product-name {
        font-size: 23px;
      }

      .admin-menu {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- Loading -->
  <div id="loading">
    <div class="loading-box">
      <div class="loading-spinner"></div>

      <div
        id="loadingText"
        class="loading-text"
      >
        系統初始化中...
      </div>
    </div>
  </div>

  <!-- Main -->
  <main
    id="app"
    class="app"
  ></main>

  <!-- Error -->
  <div
    id="errorScreen"
    class="container"
  >
    <div class="error-box">
      <h2 class="error-title">
        系統發生錯誤
      </h2>

      <div
        id="errorMessage"
        class="error-message"
      ></div>

      <button
        class="button button-secondary"
        onclick="location.reload()"
      >
        重新整理
      </button>
    </div>
  </div>


  <script>
    /*************************************************
     * 設定
     *************************************************/

    const LIFF_ID = '2011633639-yuSTNpAR';

    // ================================================
    // ★★★ 請改成你的 GAS Web App URL ★★★
    // ================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbxpNY5FuKMsL8GClN9oH_uznXM_o7HLkPPQcZSvVBbGCLvIdXOVB9ptgf1VGsrj66GE8A/exec';


    /*************************************************
     * Global State
     *************************************************/

    let currentUser = null;
    let currentAdmin = null;
    let currentProduct = null;

    let currentQuantity = 1;


    /*************************************************
     * Utility
     *************************************************/

    function log(...args) {
      console.log(...args);
    }


    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }


    function formatPrice(price) {
      const number = Number(price || 0);

      return number.toLocaleString('zh-TW', {
        maximumFractionDigits: 2
      });
    }


    function formatDate(value) {
      if (!value) {
        return '-';
      }

      const date = new Date(value);

      if (isNaN(date.getTime())) {
        return '-';
      }

      return date.toLocaleString('zh-TW', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }


    function generateRequestId() {
      if (
        window.crypto &&
        typeof window.crypto.randomUUID === 'function'
      ) {
        return window.crypto.randomUUID();
      }

      return (
        Date.now().toString(36) +
        '-' +
        Math.random().toString(36).substring(2, 12)
      );
    }


    /*************************************************
     * Loading
     *************************************************/

    function setLoading(message = '載入中...') {
      const loading = document.getElementById('loading');
      const loadingText = document.getElementById('loadingText');

      if (loadingText) {
        loadingText.textContent = message;
      }

      if (loading) {
        loading.style.display = 'flex';
      }
    }


    function hideLoading() {
      const loading = document.getElementById('loading');

      if (loading) {
        loading.style.display = 'none';
      }
    }


    /*************************************************
     * Error
     *************************************************/

    function showError(message) {
      console.error('[ERROR]', message);

      hideLoading();

      const app = document.getElementById('app');
      const errorScreen = document.getElementById('errorScreen');
      const errorMessage = document.getElementById('errorMessage');

      if (app) {
        app.style.display = 'none';
      }

      if (errorMessage) {
        errorMessage.textContent = message;
      }

      if (errorScreen) {
        errorScreen.style.display = 'block';
      }
    }


    /*************************************************
     * API
     *************************************************/

    async function apiRequest(data) {

      log('====================================');
      log('API Request:');
      console.log(data);

      if (!API_URL || API_URL === '你的 GAS Web App URL') {
        throw new Error(
          '尚未設定 GAS Web App URL'
        );
      }

      try {

        /*
         * 故意使用 text/plain。
         *
         * GAS Web App 如果直接使用 application/json，
         * 瀏覽器可能先發生 CORS preflight。
         *
         * text/plain 可以避免這個問題。
         */

        const response = await fetch(API_URL, {
          method: 'POST',

          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },

          body: JSON.stringify(data)
        });


        log('API HTTP Status:', response.status);
        log('API HTTP OK:', response.ok);


        const text = await response.text();

        log('API Raw Response:');
        console.log(text);


        if (!text) {
          throw new Error(
            'GAS 回傳空白資料'
          );
        }


        let result;

        try {
          result = JSON.parse(text);
        } catch (parseError) {

          console.error(
            'JSON Parse Error:',
            parseError
          );

          throw new Error(
            'GAS 回傳的資料不是有效 JSON：\n' +
            text.substring(0, 500)
          );
        }


        log('API Response:');
        console.log(result);

        log('====================================');


        return result;

      } catch (error) {

        console.error(
          'API Request Error:',
          error
        );

        throw error;
      }
    }


    /*************************************************
     * LINE / LIFF
     *************************************************/

    async function initLIFF() {

      setLoading('LIFF 初始化中...');

      try {

        log('[LIFF] 開始初始化');

        await liff.init({
          liffId: LIFF_ID
        });

        log('LIFF 初始化成功');


        if (!liff.isLoggedIn()) {

          log('[LIFF] 尚未登入');

          setLoading('正在登入 LINE...');

          liff.login();

          return;
        }


        log('[LIFF] LINE 登入成功');


        const idToken = liff.getIDToken();

        if (!idToken) {
          throw new Error(
            '無法取得 LINE ID Token'
          );
        }


        log('ID Token 取得成功');


        /*
         * 判斷目前是：
         *
         * ?p=P202609160001
         *
         * → 客戶商品頁
         *
         * 沒有 p
         *
         * → 管理員入口
         */

        const params = new URLSearchParams(
          window.location.search
        );

        const productId = params.get('p');


        if (productId) {

          log(
            '[ROUTER] 商品頁:',
            productId
          );

          await verifyIdentity(idToken);

          await loadProduct(productId);

        } else {

          log('[ROUTER] 管理員入口');

          await verifyAdmin(idToken);
        }


      } catch (error) {

        console.error(
          '[LIFF] 初始化失敗:',
          error
        );

        showError(
          'LINE 登入失敗：\n' +
          (error.message || String(error))
        );
      }
    }


    /*************************************************
     * Customer Identity
     *************************************************/

    async function verifyIdentity(idToken) {

      setLoading('正在確認 LINE 身分...');

      log('[IDENTITY] 開始驗證');

      const result = await apiRequest({
        action: 'verifyIdentity',
        idToken: idToken
      });


      log(
        '[IDENTITY] 驗證結果:',
        result
      );


      if (!result.success) {

        throw new Error(
          result.message ||
          result.error ||
          'LINE 身分驗證失敗'
        );
      }


      currentUser = result.user;


      log(
        '[IDENTITY] 使用者:',
        currentUser
      );
    }


    /*************************************************
     * Admin Verification
     *************************************************/

    async function verifyAdmin(idToken) {

      setLoading('正在確認管理員權限...');

      try {

        log('[ADMIN] 1. 開始 verifyAdmin');

        if (!idToken) {
          throw new Error(
            '無法取得 LINE ID Token'
          );
        }

        log('[ADMIN] 2. ID Token 存在');

        log('[ADMIN] 3. 開始呼叫 GAS');


        const result = await apiRequest({

          action: 'verifyAdmin',

          idToken: idToken

        });


        log(
          '[ADMIN] 4. GAS 回應:',
          result
        );


        if (!result) {
          throw new Error(
            'GAS 沒有回傳資料'
          );
        }


        if (!result.success) {

          throw new Error(
            result.message ||
            result.error ||
            '管理員驗證失敗'
          );
        }


        log(
          '[ADMIN] 5. GAS 驗證成功'
        );


        currentUser = result.user;


        log(
          '[ADMIN] 6. currentUser =',
          currentUser
        );


        if (!result.admin) {

          throw new Error(
            'GAS 沒有回傳 admin 資訊'
          );
        }


        log(
          '[ADMIN] 7. admin =',
          result.admin
        );


        if (!result.admin.isAdmin) {

          log(
            '[ADMIN] 8. 不是管理員'
          );

          hideLoading();

          showNonAdminPage();

          return;
        }


        log(
          '[ADMIN] 8. 管理員驗證成功'
        );


        currentAdmin = result.admin;


        log(
          '[ADMIN] 9. currentAdmin =',
          currentAdmin
        );


        log(
          '[ADMIN] 10. 準備 renderAdminHome'
        );


        renderAdminHome();


        log(
          '[ADMIN] 11. renderAdminHome 完成'
        );


      } catch (error) {

        console.error(
          '[ADMIN] 發生錯誤:',
          error
        );

        showError(
          '管理員驗證失敗：\n' +
          (error.message || String(error))
        );
      }
    }


    /*************************************************
     * Customer Product
     *************************************************/

    async function loadProduct(productId) {

      setLoading('正在載入商品...');

      log(
        '[PRODUCT] 載入商品:',
        productId
      );


      const result = await apiRequest({

        action: 'getProduct',

        productId: productId

      });


      log(
        '[PRODUCT] GAS 回應:',
        result
      );


      if (!result.success) {

        throw new Error(
          result.message ||
          result.error ||
          '找不到商品'
        );
      }


      currentProduct = result.product;

      currentQuantity = 1;


      log(
        '[PRODUCT] 商品:',
        currentProduct
      );


      renderProductPage();
    }


    /*************************************************
     * Admin Home
     *************************************************/

    function renderAdminHome() {

      console.log(
        '[ADMIN] renderAdminHome 開始'
      );


      hideLoading();


      const app = document.getElementById('app');


      if (!app) {

        throw new Error(
          '找不到 #app'
        );
      }


      app.style.display = 'block';


      const role = currentAdmin
        ? currentAdmin.role
        : 'ADMIN';


      app.innerHTML = `

        <div class="container">

          ${renderUserCard()}

          <div class="header">

            <h1 class="header-title">
              團購管理
            </h1>

            <div class="header-subtitle">
              管理員後台
            </div>

          </div>


          <div class="card">

            <div class="card-title">
              管理功能
            </div>


            <div class="admin-menu">


              <button
                class="admin-menu-button"
                onclick="showCreateProductPage()"
              >

                <div class="admin-menu-icon">
                  ➕
                </div>

                <div class="admin-menu-title">
                  新增團購
                </div>

                <div class="admin-menu-description">
                  建立新的商品與團購活動
                </div>

              </button>


              <button
                class="admin-menu-button"
                onclick="showMyProductsPage()"
              >

                <div class="admin-menu-icon">
                  📦
                </div>

                <div class="admin-menu-title">
                  我的團購
                </div>

                <div class="admin-menu-description">
                  查看與管理建立的團購
                </div>

              </button>


              <button
                class="admin-menu-button"
                onclick="showAllOrdersPage()"
              >

                <div class="admin-menu-icon">
                  🧾
                </div>

                <div class="admin-menu-title">
                  所有訂單
                </div>

                <div class="admin-menu-description">
                  查看目前所有客戶訂單
                </div>

              </button>


              ${
                role === 'OWNER'
                  ? `
                    <button
                      class="admin-menu-button"
                      onclick="showSystemPage()"
                    >

                      <div class="admin-menu-icon">
                        ⚙️
                      </div>

                      <div class="admin-menu-title">
                        系統管理
                      </div>

                      <div class="admin-menu-description">
                        管理員與系統設定
                      </div>

                    </button>
                  `
                  : ''
              }


            </div>

          </div>


          <div class="card">

            <div class="card-title">

    /*************************************************
     * Create Product API
     *************************************************/

    async function createProduct() {

      const button =
        document.getElementById(
          'createProductButton'
        );


      const productName =
        document.getElementById(
          'productName'
        ).value.trim();


      const price =
        document.getElementById(
          'productPrice'
        ).value;


      const maxQty =
        document.getElementById(
          'productMaxQty'
        ).value;


      const startAt =
        document.getElementById(
          'productStartAt'
        ).value;


      const endAt =
        document.getElementById(
          'productEndAt'
        ).value;


      const description =
        document.getElementById(
          'productDescription'
        ).value.trim();


      if (!productName) {

        alert(
          '請輸入商品名稱'
        );

        return;
      }


      if (
        price === '' ||
        Number(price) < 0
      ) {

        alert(
          '請輸入正確商品價格'
        );

        return;
      }


      if (!startAt || !endAt) {

        alert(
          '請設定開始與截止時間'
        );

        return;
      }


      if (
        new Date(endAt) <=
        new Date(startAt)
      ) {

        alert(
          '截止時間必須晚於開始時間'
        );

        return;
      }


      try {

        button.disabled = true;

        button.textContent =
          '建立中...';


        setLoading(
          '正在建立團購...'
        );


        const idToken =
          liff.getIDToken();


        if (!idToken) {

          throw new Error(
            '無法取得 LINE ID Token'
          );
        }


        const result =
          await apiRequest({

            action: 'createProduct',

            idToken: idToken,

            product: {

              productName:
                productName,

              price:
                Number(price),

              maxQty:
                maxQty === ''
                  ? 0
                  : Number(maxQty),

              startAt:
                startAt,

              endAt:
                endAt,

              description:
                description,

              options: []

            }

          });


        if (!result.success) {

          throw new Error(
            result.message ||
            result.error ||
            '建立團購失敗'
          );
        }


        log(
          '[PRODUCT] 建立成功:',
          result.product
        );


        renderCreateProductSuccess(
          result.product
        );


      } catch (error) {

        console.error(
          '[PRODUCT] 建立失敗:',
          error
        );


        hideLoading();


        alert(
          '建立失敗：\n' +
          (error.message || String(error))
        );


        button.disabled = false;

        button.textContent =
          '建立團購';
      }
    }

    async function copyProductLink() {

      const link =
        getProductLinkFromPage();


      if (!link) {

        );

      }


      try {

        await navigator.clipboard.writeText(
          link
        );

        alert(

        );

      } catch (error) {

        console.error(
          error

    async function shareProductLink() {

      const link =
        getProductLinkFromPage();


      if (!link) {

        alert(
          '找不到商品連結'
        );

        return;
      }


      try {

        if (
          liff.isApiAvailable &&
          liff.isApiAvailable(
            'shareTargetPicker'
          )
        ) {

          await liff.shareTargetPicker([

            {
              type: 'text',

              text:
                '團購商品：\n' +
                link
            }

          ]);

          return;
        }


        if (
          navigator.share
        ) {

          await navigator.share({

            title:
              '團購商品',

            text:
              '團購商品連結',

            url:
              link

          });

          return;
        }


        await navigator.clipboard.writeText(
          link
        );


        alert(
          '目前無法直接分享，商品連結已複製'
        );


      } catch (error) {

        console.error(
          '[SHARE]',
          error
        );
      }
    }

    /*************************************************
     * Quantity
     *************************************************/

    function changeQuantity(delta) {

      let next =
        currentQuantity + delta;


      if (next < 1) {
        next = 1;
      }


      /*
       * 注意：
       *
       * 目前 maxQty 在後端設計上是
       * 「整個團購的總數量上限」。
       *
       * 前端這裡暫時只做單筆訂單的
       * 基本限制。
       *
       * 真正庫存限制必須由 GAS
       * createOrder 再次檢查。
       */

      if (
        currentProduct.maxQty > 0 &&
        next > currentProduct.maxQty
      ) {

        next =
          currentProduct.maxQty;
      }


      currentQuantity =
        next;


      updateQuantityUI();
    }


    function updateQuantityUI() {

      const quantityElement =
        document.getElementById(
          'quantityValue'
        );


      const totalElement =
        document.getElementById(
          'totalPrice'
        );


      if (quantityElement) {

        quantityElement.textContent =
          currentQuantity;
      }


      if (totalElement) {

        const total =
          Number(
            currentProduct.price || 0
          ) *
          currentQuantity;


        totalElement.textContent =
          'NT$ ' +
          formatPrice(total);
      }
    }

                    order.totalPrice || 0
                  )}
                </span>

              </div>


              <div class="product-info-row">

                <span class="product-info-label">
                  狀態
                </span>

                <span class="product-info-value">
                  ${escapeHtml(
                    order.status || '-'
                  )}
                </span>

              </div>


              <div class="product-info-row">

                <span class="product-info-label">
                  訂購時間
                </span>

                <span class="product-info-value">
                  ${formatDate(
                    order.createdAt
                  )}
                </span>

              </div>

            </div>

          `).join('');
      }


      app.innerHTML = `

        <div class="container">

          ${renderCustomerUserCard()}


          <button
            class="back-button"
            onclick="location.reload()"
          >
            ← 返回
          </button>


          <div class="header">

            <h1 class="header-title">
              我的訂單
            </h1>

          </div>


          ${orderHtml}


        </div>

      `;
    }
