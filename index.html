<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>天增團購系統 - LINE</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>

<body>

  <h1>LINE 團購系統</h1>

  <p id="status">LINE 登入中...</p>

  <script>

    const LIFF_ID = '2011633639-yuSTNpAR';

    async function init() {

      try {
        
        await liff.init({
          liffId: LIFF_ID
        });
        
        if (!liff.isLoggedIn()) {
  
          liff.login();
  
          return;
        }

        const idToken = liff.getIDToken();

        if (!idToken) {
          throw new Error('無法取得 LINE ID Token');
        }

        console.log('ID Token 已取得');

        document.getElementById('status').textContent =
          'LINE 登入成功';

      } catch (error) {

        console.error(error);
      
        document.getElementById('status').textContent =
          'LINE 登入失敗';
      
      }

    }

    init();

  </script>

</body>

</html>
