<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LINE 團購系統</title>

  <!-- 樣式表 (純靜態，無 Node.js 建置需求) -->
  <link rel="stylesheet" href="css/style.css">

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>

  <!-- Loading 遮罩 -->
  <div id="loading">
    <div class="loading-box">
      <div class="loading-spinner"></div>
      <div id="loadingText" class="loading-text">
        系統初始化中...
      </div>
    </div>
  </div>

  <!-- 主畫面容器 -->
  <main id="app" class="app"></main>

  <!-- 錯誤畫面 -->
  <div id="errorScreen" class="container" style="display:none;">
    <div class="error-box">
      <h2 class="error-title">系統發生錯誤</h2>
      <div id="errorMessage" class="error-message"></div>
      <button class="button button-secondary" onclick="location.reload()">
        重新整理
      </button>
    </div>
  </div>

  <!-- 純靜態前端模組 (支援 GitHub Pages 部署) -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/customer.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
