<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>天增團購系統 - LINE</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>

<body>

  <h1>LINE 團購系統</h1>

  <p id="status">LINE 登入中...</p>

  <script>

    // =========================
    // 基本設定
    // =========================

    const LIFF_ID = '2011633639-yuSTNpAR';

    const API_URL =
      'https://script.google.com/macros/s/AKfycbxpNY5FuKMsL8GClN9oH_uznXM_o7HLkPPQcZSvVBbGCLvIdXOVB9ptgf1VGsrj66GE8A/exec';


    // =========================
    // LIFF 初始化
    // =========================

    async function init() {

      try {

        // 1. 初始化 LIFF
        await liff.init({
          liffId: LIFF_ID
        });

        console.log('LIFF 初始化成功');

        // 2. 確認 LINE 登入狀態
        if (!liff.isLoggedIn()) {

          console.log('尚未登入 LINE，開始登入');

          liff.login();

          return;
        }

        // 3. 取得 LINE ID Token
        const idToken = liff.getIDToken();

        if (!idToken) {
          throw new Error('無法取得 LINE ID Token');
        }

        console.log('LINE ID Token 已取得');

        // 4. 將 ID Token 傳給 Google Apps Script
        const response = await fetch(API_URL, {

          method: 'POST',

          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },

          body: JSON.stringify({
            action: 'verifyIdentity',
            idToken: idToken
          })

        });

        // 5. 取得 GAS 回應
        const result = await response.json();

        console.log('GAS 回應：', result);

        // 6. 判斷身份驗證結果
        if (!result.success) {

          throw new Error(
            result.message || 'LINE 身份驗證失敗'
          );

        }

        // 7. 驗證成功
        const user = result.user;

        document.getElementById('status').textContent =
          'LINE 登入成功，您好 ' + user.displayName;

        console.log('LINE User ID:', user.userId);
        console.log('LINE Name:', user.displayName);

      } catch (error) {

        console.error('錯誤：', error);

        document.getElementById('status').textContent =
          'LINE 登入失敗：' + error.message;

      }

    }

    init();

  </script>

</body>

</html>
